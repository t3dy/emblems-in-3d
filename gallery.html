<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emblems in 3D — Gallery of Reliefs</title>
  <link rel="stylesheet" href="gallery.css?v=5" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header id="bar">
    <div class="brand">
      <span class="brand-main">EMBLEMS IN 3D</span>
      <span class="brand-sub">Gallery of Carved Reliefs</span>
    </div>
    <div class="filters">
      <button class="f-btn on" data-book="all">All</button>
      <button class="f-btn" data-book="atalanta">Atalanta Fugiens</button>
      <button class="f-btn" data-book="hypnerotomachia">Hypnerotomachia</button>
      <button class="f-btn" data-book="occult">Occult archive</button>
      <input id="search" type="search" placeholder="search titles…" />
      <a id="gt-link" href="grandtour.html">✦ The Great Work ▸</a>
      <a id="jb-link" href="jukebox.html">♪ Fugue Jukebox</a>
      <a id="lab-link" href="experiments.html">⚗ The Laboratory</a>
      <a id="hist-link" href="history.html">🕰 History</a>
      <span id="count"></span>
    </div>
  </header>

  <main id="grid"></main>

  <section id="viewer">
    <canvas id="v-canvas"></canvas>
    <div id="v-top">
      <button id="v-back">◂ Gallery</button>
      <span id="v-title"></span>
    </div>
    <div id="v-tools">
      <label>Carve depth <input id="v-depth" type="range" min="0" max="0.9" step="0.02" value="0.42" /></label>
      <label><input id="v-rotate" type="checkbox" checked /> rotate</label>
      <button id="v-tour">✦ Tour the lab process</button>
      <a id="v-scene">Walk the scene ▸</a>
      <a id="v-env" href="index.html">Enter the full environment ▸</a>
    </div>
    <div id="v-loading">carving the relief…</div>
  </section>

  <script type="module" src="gallery.js"></script>
</body>
</html>
