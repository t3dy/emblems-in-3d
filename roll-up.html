<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll Up Mode — Emblems in 3D</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1610;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: #e8ddc4;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(12, 10, 7, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-size: 18px;
      color: #c4a86a;
      letter-spacing: 2px;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Roll Up Mode…</div>

  <script type="module">
    import * as THREE from "three";
    import { RollUp } from "./systems/RollUp.js";
    import { RollUpHUD } from "./ui/RollUpHUD.js";

    // Parse URL params for tuning
    const params = new URLSearchParams(location.search);
    const tune = {
      camBase: parseFloat(params.get('tune.camBase')) || 1.2,
      camScale: parseFloat(params.get('tune.camScale')) || 2.0,
      quickTurnBoost: parseFloat(params.get('tune.quickTurnBoost')) || 1.2,
      weddingZoomDuration: parseFloat(params.get('tune.weddingZoomDuration')) || 2.0,
      weddingZoomScale: parseFloat(params.get('tune.weddingZoomScale')) || 40.0,
    };

    const physicsOptions = {
      slopeAngle: parseFloat(params.get('physics.slopeAngle')) || 0.15,
      rollResistance: parseFloat(params.get('physics.rollResistance')) || 0.05,
    };

    // Expose tuning for live tweaking
    window.roll = { tune };

    // Setup Three.js
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a7c8c);
    scene.fog = new THREE.Fog(0x5a7c8c, 50, 200);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xb8ad90, 0.5);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfff2d6, 1.2);
    sun.position.set(-12, 20, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 100;
    Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 });
    scene.add(sun);

    // Ground plane
    const groundGeometry = new THREE.PlaneGeometry(200, 400);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x6b5a47,
      roughness: 0.8,
      metalness: 0.1,
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // Create Roll Up system
    const rollUp = new RollUp(scene, camera, { tune, ...physicsOptions });

    // Create HUD
    const hud = new RollUpHUD(rollUp);

    // Hide loading screen
    setTimeout(() => {
      const loadingEl = document.getElementById('loading');
      loadingEl.classList.add('hidden');
    }, 500);

    // Audio context for wedding fanfare
    let audioContext = null;

    function createWeddingFanfare() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      const ctx = audioContext;
      const now = ctx.currentTime;

      // Simple fanfare: C major chord up to high G
      const notes = [
        { freq: 262, time: 0.0, duration: 0.3 },  // C4
        { freq: 330, time: 0.2, duration: 0.3 },  // E4
        { freq: 392, time: 0.4, duration: 0.3 },  // G4
        { freq: 523, time: 0.6, duration: 0.3 },  // C5
        { freq: 659, time: 0.8, duration: 0.5 },  // E5
        { freq: 784, time: 1.1, duration: 0.8 },  // G5
      ];

      for (const note of notes) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.value = note.freq;

        gain.gain.setValueAtTime(0.3, now + note.time);
        gain.gain.exponentialRampToValueAtTime(0.01, now + note.time + note.duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + note.time);
        osc.stop(now + note.time + note.duration);
      }
    }

    // Listen for wedding event
    window.addEventListener('weddingStarted', () => {
      // Play fanfare after a short delay (camera zoom in progress)
      setTimeout(() => {
        createWeddingFanfare();
      }, (tune.weddingZoomDuration + 0.2) * 1000);
    });

    // Handle window resize
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    // Animation loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.016); // Cap at 60fps

      // Update Roll Up system
      rollUp.update(dt);

      // Update HUD
      hud.update();

      // Render
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
