<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANTIGRAVFUGIENS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="stage">
      <canvas id="world" width="1440" height="900" aria-label="Surreal fugue visualization"></canvas>
      <div class="hud top">
        <a class="back" href="../index.html">EMBLEMSIN3D</a>
        <div class="brand">
          <span>ANTIGRAVFUGIENS</span>
          <strong>Anti-gravity fugue experiments for Maier's emblems</strong>
        </div>
        <button id="audio">Play</button>
      </div>
      <div class="hud bottom">
        <div class="emblem-card">
          <img id="plate" alt="">
          <div>
            <p id="kicker">Emblem</p>
            <h1 id="title">Loading</h1>
            <p id="motto"></p>
          </div>
        </div>
        <div class="signal">
          <span id="version">Version 1/10</span>
          <strong id="palette">Waiting for sound</strong>
          <small id="effect">Delay, vibrato, envelope, harmony</small>
        </div>
      </div>
    </section>

    <aside class="console" aria-label="Experiment controls">
      <div class="control-block">
        <label for="emblem">Emblem</label>
        <select id="emblem"></select>
      </div>
      <div class="control-block">
        <label for="experiment">Experiment</label>
        <select id="experiment"></select>
      </div>
      <div class="meter">
        <span>heat</span><i id="heat"></i>
        <span>orbit</span><i id="orbit"></i>
        <span>mercury</span><i id="mercury"></i>
      </div>
      <div class="buttons">
        <button id="next">Next Tune</button>
        <button id="mute">Mute</button>
      </div>
      <section class="essay">
        <h2 id="essay-title">Experiment Notes</h2>
        <p id="essay"></p>
      </section>
      <section class="lab-index">
        <h2>Soundtrack Variants</h2>
        <ol id="variants"></ol>
      </section>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
